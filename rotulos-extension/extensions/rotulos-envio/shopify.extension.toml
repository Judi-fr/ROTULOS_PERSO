api_version = "2026-07"

# Rótulos de envío desde el admin de Shopify: el comerciante tilda pedidos
# en su lista, abre "Imprimir" y elige esta opción. El PDF lo arma nuestro
# backend (backend/apps/integrations/providers/shopify/admin_print.py y store_print.py).
[[extensions]]
name = "t:name"
handle = "rotulos-envio"
type = "ui_extension"
uid = "427c870c-2df5-21c0-5023-973edce6213e3c07ac80"

# Una extensión de impresión admite un solo lugar: la lista de pedidos con
# selección múltiple (para un pedido suelto, se tilda uno solo).
[[extensions.targeting]]
module = "./src/PrintActionExtension.jsx"
target = "admin.order-index.selection-print-action.render"

# "Planilla de retiro": segunda opción del mismo menú Imprimir (otro PDF del
# mismo backend, action "manifest"). Sin uid: lo agrega el CLI en el próximo
# ``shopify app deploy``.
[[extensions]]
name = "t:name_manifest"
handle = "rotulos-planilla"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/ManifestPrintAction.jsx"
target = "admin.order-index.selection-print-action.render"

# "Despachar con Andreani": acción masiva de la lista de pedidos (menú "Más
# acciones"), no de Imprimir — despachar cambia los pedidos y se confirma con
# un botón. El backend crea los envíos (action "dispatch") y devuelve el PDF.
[[extensions]]
name = "t:name_dispatch"
handle = "rotulos-despachar"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/DispatchAction.jsx"
target = "admin.order-index.selection-action.render"
