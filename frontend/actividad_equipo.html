<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Actividad del equipo</title>

    <link
      href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/pedidos.css" />
    <link rel="stylesheet" href="assets/css/equipo.css" />
  </head>
  <body>
    <div class="layout">
      <header class="topbar" id="appTopbar" data-links='[{"href": "equipo.html", "label": "Mi equipo"}, {"href": "dashboard.html", "label": "Volver al panel"}]'></header>

      <main class="main">
        <div class="main-heading">
          <h1>Actividad del equipo</h1>
          <p>Qué hizo cada persona del comercio: despachos, cancelaciones, rótulos, tiendas y cambios del equipo.</p>
        </div>

        <p id="pageMessage" class="page-message" role="status" aria-live="polite" style="display:none;"></p>

        <section class="profile-card">
          <div class="profile-card-title">Filtros</div>
          <form class="profile-card-body activity-filters" id="filterForm">
            <div class="field">
              <label for="filterActor">Persona</label>
              <select id="filterActor"><option value="">Todas</option></select>
            </div>
            <div class="field">
              <label for="filterSearch">Buscar</label>
              <input id="filterSearch" type="search" placeholder="Pedido, tienda, acción..." />
            </div>
            <div class="field">
              <label for="filterFrom">Desde</label>
              <input id="filterFrom" type="date" />
            </div>
            <div class="field">
              <label for="filterTo">Hasta</label>
              <input id="filterTo" type="date" />
            </div>
            <button type="submit" class="btn btn-primary">Filtrar</button>
          </form>
        </section>

        <section class="profile-card">
          <div class="profile-card-title">Movimientos</div>
          <div class="profile-card-body">
            <div class="table-scroll">
              <table class="activity-table">
                <thead><tr><th>Cuándo</th><th>Quién</th><th>Qué</th><th>Sobre qué</th></tr></thead>
                <tbody id="activityBody"><tr><td colspan="4" class="access-muted">Cargando...</td></tr></tbody>
              </table>
            </div>
            <div class="team-actions" id="pager"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/topbar.js"></script>
    <script src="assets/js/actividad_equipo.js"></script>
  </body>
</html>
