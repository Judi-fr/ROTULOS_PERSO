<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Imprimir rótulos</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
    <meta name="theme-color" content="#308028" />
    <link rel="stylesheet" href="assets/css/ui.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link rel="stylesheet" href="assets/css/pedidos.css" />
    <link rel="stylesheet" href="assets/css/imprimir_rotulos.css?v=2026-11-11" />
  </head>
  <body data-requires="labels.batch">
    <div class="layout">
      <!-- La barra la dibuja assets/js/topbar.js; acá solo los links propios. -->
      <header class="topbar" id="appTopbar" data-links='[{"href": "pedidos.html", "label": "Mis pedidos", "perm": "orders.view"}, {"href": "documentos.html", "label": "Documentos", "perm": "documents.view"}, {"href": "cola_impresion.html", "label": "Cola de impresión", "perm": "labels.batch"}, {"href": "impresoras.html", "label": "Impresoras", "perm": "printers.manage"}, {"href": "dashboard.html", "label": "Volver al panel"}]'></header>

      <main class="main print-main">
        <div class="main-heading">
          <h1>Imprimir rótulos</h1>
          <p>Elegí los pedidos y generá sus rótulos en un solo archivo.</p>
        </div>

        <p id="pageMessage" class="page-message" role="status" aria-live="polite" style="display:none;"></p>

        <!-- Dos columnas (2026-11-11): a la izquierda los filtros y la lista,
             a la derecha "Cómo imprimir" fijo al bajar, con lo tildado y el
             botón siempre a la vista. En el celular, una columna y la barra
             flotante de abajo (printDock). -->
        <div class="print-layout">
          <section class="profile-card print-orders" aria-labelledby="printOrdersTitle">
            <div class="profile-card-title">
              <span id="printOrdersTitle">Pedidos</span>
              <span class="selection-count" id="selectionCount">0 seleccionados</span>
            </div>
            <div class="profile-card-body">
              <div class="filters-row">
                <div class="field" id="storeFilterField" style="display:none;">
                  <label for="storeFilter">Tienda</label>
                  <select id="storeFilter">
                    <option value="">Todas las tiendas</option>
                  </select>
                </div>
                <div class="field">
                  <label for="statusFilter">Estado</label>
                  <select id="statusFilter">
                    <option value="created,preparing">Pendientes de despacho</option>
                    <option value="">Todos</option>
                    <option value="created">Creados</option>
                    <option value="preparing">En preparación</option>
                    <option value="dispatched">Despachados</option>
                  </select>
                </div>
                <div class="field">
                  <label for="printedFilter">Rótulo</label>
                  <select id="printedFilter">
                    <option value="">Todos</option>
                    <option value="0">Sin imprimir</option>
                    <option value="1">Ya impresos</option>
                  </select>
                </div>
                <div class="field">
                  <label for="dateFrom">Desde</label>
                  <input type="date" id="dateFrom" />
                </div>
                <div class="field">
                  <label for="dateTo">Hasta</label>
                  <input type="date" id="dateTo" />
                </div>
              </div>
              <p class="filters-hint">
                Desde y Hasta filtran por la fecha en que entró el pedido: sirve
                para juntar los de una semana y usar "Seleccionar todos".
              </p>
              <div class="select-all-row">
                <input type="checkbox" id="selectAll" />
                <label for="selectAll">Seleccionar todos los de esta página</label>
              </div>
              <div id="orderList" class="print-order-list">
                <p class="empty-state"><span class="app-skeleton" role="status" aria-label="Cargando…"><span></span><span></span><span></span></span></p>
              </div>
              <div class="pager" id="pager" style="display:none;">
                <button type="button" class="btn btn-outline btn-small" id="prevPageBtn">Anterior</button>
                <span id="pageInfo"></span>
                <button type="button" class="btn btn-outline btn-small" id="nextPageBtn">Siguiente</button>
              </div>
            </div>
          </section>

          <aside class="profile-card print-side" aria-labelledby="printSideTitle">
            <div class="profile-card-title"><span id="printSideTitle">Cómo imprimir</span></div>
            <div class="profile-card-body">
              <p class="print-side-count"><strong id="printSideCount">0</strong> <span id="printSideCountLabel">pedidos tildados</span></p>
              <div class="filters-row">
                <div class="field">
                  <label for="templateSelect">Plantilla</label>
                  <select id="templateSelect">
                    <option value="">La de cada tienda</option>
                  </select>
                </div>
                <div class="field">
                  <label for="pageLayoutSelect">Formato</label>
                  <!-- Una sola pregunta, "sobre qué imprimís", en vez de
                       separar salida, layout y densidad: el comerciante sabe
                       qué impresora tiene, no qué es un dpmm. -->
                  <select id="pageLayoutSelect">
                    <optgroup label="Impresora común (PDF)">
                      <option value="label">Una hoja por rótulo</option>
                      <option value="a4">Varios rótulos por hoja A4</option>
                    </optgroup>
                    <optgroup label="Térmica Zebra (ZPL)">
                      <option value="zpl">La impresora de la tienda</option>
                      <option value="zpl-203">Forzar 203 dpi</option>
                      <option value="zpl-300">Forzar 300 dpi</option>
                    </optgroup>
                    <!-- Las impresoras del comerciante (apps.printing): mandar
                         directo, sin descargar. Lo llena print_labels.js. -->
                    <optgroup label="Mandar directo a una impresora" id="printerOptions" hidden></optgroup>
                  </select>
                  <a class="field-hint" href="impresoras.html">Configurar impresoras</a>
                </div>
              </div>
              <div class="field-checkbox">
                <input type="checkbox" id="skipExisting" checked />
                <label for="skipExisting" style="margin:0;">Omitir los pedidos que ya tienen rótulo</label>
              </div>
              <div class="field-checkbox">
                <input type="checkbox" id="markDispatched" />
                <label for="markDispatched" style="margin:0;">
                  Marcar los pedidos como despachados después de imprimir
                </label>
              </div>
              <p id="printMsg" class="form-message" style="display:none;"></p>
              <button type="button" class="btn btn-primary print-side-btn" id="printBtn"><i class="ph ph-printer" aria-hidden="true"></i> Generar rótulos</button>
            </div>
          </aside>
        </div>

        <!-- Lo tildado y "Generar rótulos" a mano mientras se recorre la lista:
             el botón de verdad queda al fondo (print_labels.js, updatePrintDock). -->
        <div class="print-dock" id="printDock" hidden>
          <span class="print-dock-text">
            <strong id="printDockCount"></strong>
            <span class="print-dock-hint" id="printDockHint"></span>
          </span>
          <span class="print-dock-actions">
            <button type="button" class="btn-link" id="printDockOptions">Cambiar opciones</button>
            <button type="button" class="btn btn-primary btn-small" id="printDockBtn">Generar rótulos</button>
          </span>
        </div>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/topbar.js"></script>
    <script src="assets/js/print_labels.js?v=2026-11-11"></script>
  </body>
</html>
