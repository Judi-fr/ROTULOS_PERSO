<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Tu actividad</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/css/ui.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link rel="stylesheet" href="assets/css/equipo.css" />
  </head>
  <body>
    <div class="layout">
      <header class="topbar" id="appTopbar" data-links='[{"href": "organizacion.html", "label": "Mi cuenta"}, {"href": "dashboard.html", "label": "Volver al panel"}]'></header>

      <main class="main">
        <div class="main-heading">
          <h1>Tu actividad</h1>
          <p>
            Lo que hiciste en tu comercio: despachos, cancelaciones, rótulos, tiendas y cambios del equipo.
            Lo de todo el equipo lo ve quien tiene el acceso «Equipo».
          </p>
        </div>

        <p id="pageMessage" class="page-message" role="status" aria-live="polite"></p>

        <!-- Backend: GET /api/v1/team/activity/mine/ (team_views.MyActivityView). -->
        <section class="profile-card">
          <div class="profile-card-title">Filtros</div>
          <form class="profile-card-body activity-filters" id="filterForm">
            <div class="field">
              <label for="filterSearch">Buscar</label>
              <input id="filterSearch" type="search" placeholder="Pedido, tienda, acción..." />
            </div>
            <div class="field">
              <label for="filterFrom">Desde</label>
              <input id="filterFrom" type="date" />
            </div>
            <div class="field">
              <label for="filterTo">Hasta</label>
              <input id="filterTo" type="date" />
            </div>
            <button type="submit" class="btn btn-primary">Filtrar</button>
          </form>
        </section>

        <section class="profile-card">
          <div class="profile-card-title">Movimientos</div>
          <div class="profile-card-body">
            <div class="table-scroll">
              <table class="activity-table">
                <thead><tr><th>Cuándo</th><th>Qué</th><th>Sobre qué</th></tr></thead>
                <tbody id="activityBody"><tr><td colspan="3" class="access-muted"><span class="app-skeleton" role="status" aria-label="Cargando…"><span></span><span></span><span></span></span></td></tr></tbody>
              </table>
            </div>
            <div class="team-actions" id="pager"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/topbar.js"></script>
    <script src="assets/js/mi_actividad.js"></script>
  </body>
</html>
