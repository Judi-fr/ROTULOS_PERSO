<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Mi Panel</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/css/ui.css" />

    <link
      href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font@4.9.95/css/materialdesignicons.min.css"
    />

    <link rel="stylesheet" href="assets/css/dashboard.css?v=2026-10-21c" />
  </head>
  <body>
    <div class="layout">
      <header class="topbar">
        <div class="topbar-user">
          <img
            class="avatar"
            id="userAvatar"
            src="https://api.dicebear.com/7.x/avataaars/svg?seed=user"
            alt=""
          />
          <div class="topbar-user-info">
            <span class="topbar-user-name" id="userName">—</span>
            <span class="topbar-user-email" id="userEmail">—</span>
          </div>
        </div>
        <!-- El comercio de esta pestaña y el cambio a otro (renderTeamSwitcher). -->
        <div class="topbar-team" id="teamSwitcher"></div>
        <div class="topbar-actions">
          <a
            class="btn btn-outline"
            id="backToAdminLink"
            href="gestionuser.html"
            style="display:none;"
            >Volver al panel de administración</a
          >
          <button class="btn btn-outline" id="logoutBtn" type="button">
            Cerrar sesión
          </button>
        </div>
      </header>

      <main class="main">
        <div class="main-heading">
          <h1>Mi panel</h1>
          <p>Elegí una sección: adentro de cada una están sus herramientas.</p>
        </div>

        <!-- Buscador de funciones (dashboard.js, setupToolSearch): busca en
             todas las herramientas a las que el usuario tiene acceso, también
             las que no entran en las tarjetas. -->
        <div class="tool-search" id="toolSearch" role="search">
          <i class="mdi mdi-magnify" aria-hidden="true"></i>
          <input
            type="search"
            id="toolSearchInput"
            placeholder="Buscar una función: planilla, impresora, tarifas…"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="toolSearchResults"
            aria-label="Buscar una función"
          />
          <kbd class="tool-search-key" aria-hidden="true">/</kbd>
          <ul id="toolSearchResults" class="tool-search-results" role="listbox" hidden></ul>
        </div>

        <p id="dashboardMessage" class="dashboard-message" role="status" aria-live="polite" style="display:none;"></p>
        <!-- El admin sin comercio: puede crear uno o sumarse (dashboard.js). -->
        <p id="noTeamNotice" class="dashboard-message info" hidden>
          No estás trabajando en ningún comercio.
          <a href="comercio_inicio.html">Crear uno o sumarte a uno</a>
        </p>
        <!-- Invitaciones a un comercio (dashboard.js / loadInvitationNotice). -->
        <p id="invitationNotice" class="dashboard-message info" hidden></p>

        <!-- Avisos del comercio (dashboard.js / loadNotices) y primeros pasos
             de un comercio nuevo (renderOnboarding). -->
        <section id="noticesBox" class="notices" aria-label="Avisos" hidden></section>
        <section id="onboardingBox" class="onboarding" aria-label="Primeros pasos" hidden></section>

        <div class="summary-grid" id="summaryGrid" style="display:none;"></div>

        <div id="menuGroups">
          <p class="menu-loading"><span class="app-skeleton" role="status" aria-label="Cargando…"><span></span><span></span><span></span></span></p>
        </div>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js?v=2026-10-21c"></script>
    <script src="assets/js/dashboard.js?v=2026-10-21d"></script>
  </body>
</html>
