<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Mi Panel</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/css/ui.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css?v=2026-10-29" />
  </head>
  <body>
    <div class="layout">
      <!-- La barra compartida (assets/js/topbar.js): panel, comercio, cuenta.
           "Administración" solo para quien puede ver usuarios (el admin). -->
      <header class="topbar" id="appTopbar" data-links='[{"href": "gestionuser.html", "label": "Administración", "perm": "users.view"}]'></header>

      <main class="main">
        <div class="main-heading">
          <h1 id="dashboardTitle">Hoy</h1>
          <p>Lo que tu comercio tiene pendiente y por dónde seguir.</p>
        </div>

        <!-- Buscador de funciones (dashboard.js, setupToolSearch): busca en
             todas las herramientas a las que el usuario tiene acceso, también
             las que no entran en las tarjetas. -->
        <div class="tool-search" id="toolSearch" role="search">
          <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
          <input
            type="search"
            id="toolSearchInput"
            placeholder="Buscar una función: planilla, impresora, tarifas…"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="toolSearchResults"
            aria-label="Buscar una función"
          />
          <kbd class="tool-search-key" aria-hidden="true">/</kbd>
          <ul id="toolSearchResults" class="tool-search-results" role="listbox" hidden></ul>
        </div>

        <p id="dashboardMessage" class="dashboard-message" role="status" aria-live="polite" style="display:none;"></p>
        <!-- El admin sin comercio: puede crear uno o sumarse (dashboard.js). -->
        <p id="noTeamNotice" class="dashboard-message info" hidden>
          No estás trabajando en ningún comercio.
          <a href="comercio_inicio.html">Crear uno o sumarte a uno</a>
        </p>
        <!-- Invitaciones a un comercio (dashboard.js / loadInvitationNotice). -->
        <p id="invitationNotice" class="dashboard-message info" hidden></p>

        <!-- Bandeja de trabajo (dashboard.js / loadToday): los números del día
             (GET /orders/summary/) y "Qué hacer ahora", que junta lo pendiente
             con los avisos del comercio (GET /notices/). -->
        <section id="onboardingBox" class="onboarding" aria-label="Primeros pasos" hidden></section>
        <section id="todayStats" class="today-stats" aria-label="Números de hoy" hidden></section>
        <section id="todoBox" class="todo" aria-labelledby="todoTitle" hidden>
          <h2 class="todo-title" id="todoTitle">Qué hacer ahora</h2>
          <ul class="todo-list" id="todoList"></ul>
        </section>

        <h2 class="tools-title" id="toolsTitle">Todas las herramientas</h2>
        <div id="menuGroups">
          <p class="menu-loading"><span class="app-skeleton" role="status" aria-label="Cargando…"><span></span><span></span><span></span></span></p>
        </div>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js?v=2026-10-29"></script>
    <script src="assets/js/topbar.js"></script>
    <script src="assets/js/dashboard.js?v=2026-10-29"></script>
  </body>
</html>
