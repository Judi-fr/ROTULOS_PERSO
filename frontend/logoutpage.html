<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logout</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="stylesheet" href="assets/css/ui.css" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
  <style>
    body {
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }
    .logout-box {
      max-width: 520px;
      margin: 120px auto;
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }
    .user-card {
      background: #ffedd5;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      background: #f97316;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      margin-right: 14px;
    }
    .logout-box .btn-danger {
      background: #111111;
      border-color: #111111;
    }
    .logout-box .btn-danger:hover {
      background: #f97316;
      border-color: #f97316;
    }
  </style>
</head>
<body>
  <div class="logout-box">
    <h2 class="mb-3">Panel de sesión</h2>
    <div id="user-card" class="user-card d-flex align-items-center" style="display:none;">
      <div id="avatar" class="avatar">U</div>
      <div>
        <strong id="user-name">Usuario</strong><br>
        <small id="user-email">correo@dominio.com</small>
      </div>
    </div>

    <p class="text-muted">¿Quieres cerrar la sesión actual?</p>
    <button id="logout-btn" class="btn btn-danger btn-block w-100">Cerrar sesión</button>
    <div id="status" class="mt-3 small text-muted"></div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // La sesión vive en cookies HttpOnly (assets/js/auth.js): acá solo se
    // muestra quién es y se cierra con window.Auth.logout().
    function renderUser() {
      const user = window.Auth.hasSession() ? window.Auth.getCurrentUser() : null;
      const card = document.getElementById("user-card");
      const nameEl = document.getElementById("user-name");
      const emailEl = document.getElementById("user-email");
      const avatarEl = document.getElementById("avatar");

      if (!user) {
        window.location.replace("index.html");
        return;
      }

      card.style.display = "flex";
      const name = user.display_name || "Usuario";
      const email = user.email || "sin-email";

      nameEl.textContent = name;
      emailEl.textContent = email;
      avatarEl.textContent = user.initial || "U";
    }

    async function logout() {
      document.getElementById("status").textContent = "Cerrando sesión...";
      await window.Auth.logout();
    }

    document.addEventListener("DOMContentLoaded", function () {
      renderUser();
      document.getElementById("logout-btn").addEventListener("click", logout);
    });
  </script>
</body>
</html>
