<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cerrar sesión</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="stylesheet" href="assets/css/ui.css" />
  <link href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/acceso.css" />
</head>
<body class="access-page">
  <div class="access-layout">
    <aside class="access-aside" aria-hidden="true">
      <img src="assets/images/LogoLogin.png" alt="" />
    </aside>

    <main class="access-main">
      <div class="access-card">
        <img src="assets/images/HLLogoFinal.jpg" alt="" class="access-logo" />
        <h1>Cerrar sesión</h1>
        <p class="access-lead">Vas a salir de esta cuenta en este navegador.</p>

        <div id="user-card" class="access-user" hidden>
          <img id="avatar" alt="" />
          <div>
            <strong id="user-name">Usuario</strong>
            <span id="user-email"></span>
          </div>
        </div>

        <p id="status" class="page-message success" role="status" hidden></p>
        <button id="logout-btn" type="button" class="access-submit" style="width: 100%">Cerrar sesión</button>
        <a href="dashboard.html" class="access-link access-secondary">Volver al panel</a>
      </div>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // La sesión vive en cookies HttpOnly (assets/js/auth.js): acá solo se
    // muestra quién es y se cierra con window.Auth.logout().
    function renderUser() {
      const user = window.Auth.hasSession() ? window.Auth.getCurrentUser() : null;
      const card = document.getElementById("user-card");
      const nameEl = document.getElementById("user-name");
      const emailEl = document.getElementById("user-email");
      const avatarEl = document.getElementById("avatar");

      if (!user) {
        window.location.replace("index.html");
        return;
      }

      card.hidden = false;
      const name = user.display_name || user.email || "Usuario";
      const email = user.email || "";

      nameEl.textContent = name;
      emailEl.textContent = email;
      // La foto propia, si no la de Google, si no un avatar generado.
      avatarEl.src = user.photo || user.picture || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(email)}`;
    }

    async function logout() {
      const status = document.getElementById("status");
      status.textContent = "Cerrando la sesión…";
      status.hidden = false;
      document.getElementById("logout-btn").disabled = true;
      await window.Auth.logout();
    }

    document.addEventListener("DOMContentLoaded", function () {
      renderUser();
      document.getElementById("logout-btn").addEventListener("click", logout);
    });
  </script>
</body>
</html>
