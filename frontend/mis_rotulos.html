<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Mis Rótulos</title>

    <link
      href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/labels_shared.css" />
  </head>
  <body>
    <div class="layout">
      <!-- La barra la dibuja assets/js/topbar.js; acá solo los links propios. -->
      <header class="topbar" id="appTopbar" data-links='[{"href": "dashboard.html", "label": "Volver al panel"}]'></header>

      <main class="main">
        <div class="main-heading">
          <h1>Mis rótulos</h1>
          <p>Creá y gestioná los rótulos de tus encomiendas.</p>
        </div>

        <p
          id="pageMessage"
          class="page-message"
          role="status"
          aria-live="polite"
          style="display: none"
        ></p>

        <section class="profile-card">
          <div class="profile-card-title">Rótulos</div>
          <div class="profile-card-body">
            <div class="rotulos-toolbar">
              <input
                type="search"
                id="searchInput"
                class="search-input"
                placeholder="Buscar por nombre o destinatario..."
              />
              <a class="btn btn-outline" href="imprimir_rotulos.html">
                Imprimir por lote
              </a>
              <a class="btn btn-primary" href="editor_rotulos.html">
                + Nuevo rótulo
              </a>
            </div>

            <div id="rotulosGrid" class="rotulos-grid">
              <p class="empty-state">Cargando rótulos...</p>
            </div>
          </div>
        </section>

      </main>
    </div>

    <!-- Modal de vista previa (uno solo, reutilizado) -->
    <div class="modal-overlay" id="previewOverlay">
      <div class="modal-box">
        <img id="previewImg" alt="Vista previa del rótulo" />
        <h3 id="previewNombre"></h3>
        <p class="preview-detail">
          <strong>Destinatario:</strong> <span id="previewCliente"></span>
        </p>
        <p class="preview-detail">
          <strong>Última modificación:</strong> <span id="previewFecha"></span>
        </p>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="previewCloseBtn">
            Cerrar
          </button>
        </div>
      </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/topbar.js"></script>
    <script src="assets/js/print.js"></script>
    <script src="assets/js/saved_labels.js"></script>
  </body>
</html>
