<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Mi cuenta</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/css/ui.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link rel="stylesheet" href="assets/css/perfil.css" />
    <link rel="stylesheet" href="assets/css/organizacion.css" />
    <script>
      // organizacion.html#comercio (enlaces viejos): los datos del comercio
      // pasaron a Mi comercio.
      if (["#comercio", "#leaveTeamSection", "#closeTeamSection"].includes(location.hash)) {
        location.replace("equipo.html#datos");
      }
    </script>
  </head>
  <body>
    <div class="layout">
      <header class="topbar" id="appTopbar" data-links='[{"href": "equipo.html", "label": "Equipo", "perm": "team.manage"}, {"href": "equipo.html#actividad", "label": "Actividad", "perm": "team.manage"}, {"href": "mi_actividad.html", "label": "Tu actividad"}, {"href": "dashboard.html", "label": "Volver al panel"}]'></header>

      <main class="main">
        <div class="main-heading">
          <h1>Mi cuenta</h1>
          <p>Tu perfil y los datos de tu comercio, en un solo lugar.</p>
        </div>

        <p id="pageMessage" class="page-message" role="status" aria-live="polite" style="display:none;"></p>

        <!-- TU PERFIL (assets/js/perfil.js): lo de la persona que entró. -->
        <h2 class="account-section-title" id="perfil">Tu perfil</h2>
        <!-- Aviso de email sin verificar (ver perfil.js): solo se muestra si
             email_verified es false; verificación suave, no bloquea nada. -->
        <p id="emailVerificationNotice" class="page-message" role="status" aria-live="polite" style="display:none;">
          Todavía no confirmaste tu email.
          <button type="button" class="btn btn-outline" id="resendVerificationBtn">
            Reenviar email de verificación
          </button>
        </p>

        <!-- Datos personales -->
        <section class="profile-card">
          <div class="profile-card-title">Datos personales</div>
          <div class="profile-card-body account-grid">
            <!-- Foto propia (perfil personal): la ve el equipo y sale arriba.
                 Sin foto se usa la de Google o el dibujo automático. -->
            <div class="field profile-photo-field">
              <label for="photoInput">Foto</label>
              <div class="profile-photo-row">
                <img id="photoPreview" class="profile-photo" alt="Tu foto" />
                <div class="profile-photo-actions">
                  <input id="photoInput" type="file" accept="image/png,image/jpeg,image/webp" />
                  <button type="button" class="btn btn-outline" id="photoRemove" hidden>Quitar la foto</button>
                  <p class="field-hint">Se recorta cuadrada. Hasta 2 MB.</p>
                </div>
              </div>
            </div>
            <div class="field">
              <label for="firstNameInput">Nombre</label>
              <input type="text" id="firstNameInput" placeholder="Nombre" autocomplete="given-name" />
            </div>
            <div class="field">
              <label for="lastNameInput">Apellido</label>
              <input type="text" id="lastNameInput" placeholder="Apellido" autocomplete="family-name" />
            </div>
            <div class="field">
              <label for="preferredNameInput">Nombre para mostrar</label>
              <input type="text" id="preferredNameInput" maxlength="60" placeholder="Cómo te ve tu equipo (opcional)" autocomplete="nickname" />
            </div>
            <div class="field">
              <label for="jobTitleInput">Puesto</label>
              <input type="text" id="jobTitleInput" maxlength="80" placeholder="Por ejemplo: Depósito, Ventas" autocomplete="organization-title" />
            </div>
            <div class="field">
              <label for="phoneInput">Teléfono</label>
              <input type="tel" id="phoneInput" maxlength="50" placeholder="Lo ve tu equipo (opcional)" autocomplete="tel" />
            </div>
            <div class="field">
              <label>Email</label>
              <p class="field-static" id="emailValue">—</p>
            </div>
            <div class="field">
              <label>Rol</label>
              <p class="field-static" id="roleValue">—</p>
            </div>
            <div class="field">
              <label>Estado</label>
              <p class="field-static" id="statusValue">—</p>
            </div>
            <p id="profileMsg" class="form-message" style="display:none;"></p>
            <div class="profile-card-actions">
              <button type="button" class="btn btn-primary" id="saveProfileBtn">
                Guardar cambios
              </button>
            </div>
          </div>
        </section>

        <!-- Cambio de contraseña -->
        <section class="profile-card">
          <div class="profile-card-title">Cambiar contraseña</div>
          <div class="profile-card-body account-grid">
            <div class="field">
              <label for="currentPasswordInput">Contraseña actual</label>
              <input type="password" id="currentPasswordInput" placeholder="Tu contraseña actual" autocomplete="current-password" />
            </div>
            <div class="field">
              <label for="newPasswordInput">Nueva contraseña</label>
              <input type="password" id="newPasswordInput" placeholder="Mínimo 6 caracteres, una mayúscula y un número" autocomplete="new-password" />
            </div>
            <div class="field">
              <label for="confirmPasswordInput">Confirmar nueva contraseña</label>
              <input type="password" id="confirmPasswordInput" placeholder="Repetir nueva contraseña" autocomplete="new-password" />
            </div>
            <p id="passwordMsg" class="form-message" style="display:none;"></p>
            <div class="profile-card-actions">
              <button type="button" class="btn btn-primary" id="savePasswordBtn">
                Cambiar contraseña
              </button>
            </div>
          </div>
        </section>

        <!-- Los datos del comercio, la baja y salir del comercio están desde el
             2026-10-30 en Mi comercio (equipo.html#datos): esta página es solo
             de la persona. -->
        <section class="profile-card account-moved">
          <div class="profile-card-body">
            <p class="account-section-help">
              Los datos de tu comercio (razón social, remitente, logo y
              preferencias) ahora están en <a href="equipo.html#datos">Mi comercio</a>.
            </p>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/topbar.js"></script>
    <script src="assets/js/perfil.js"></script>
  </body>
</html>
