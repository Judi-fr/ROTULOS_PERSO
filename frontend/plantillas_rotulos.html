<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Plantillas de rótulos</title>
    <!-- Sin Bootstrap a propósito: define .btn, .card, .badge y .modal con
         reglas propias (.modal arranca oculto) que pisaban las de esta página. -->
    <link rel="stylesheet" href="/assets/css/gestionrotulos.css" />
  </head>
  <body>
    <script src="/assets/html/aside.js"></script>
    <app-sidebar active="rotulos"></app-sidebar>

    <main>
      <div class="topbar">
        <div>
          <h1>Plantillas de rótulos</h1>
          <p class="subtitle">
            Creá, editá e imprimí las plantillas de rótulos de tus envíos.
          </p>
        </div>
        <div class="topbar-actions">
          <a href="/importar.html" class="btn">Importar desde foto</a>
          <a href="/pedidos/dise%C3%B1orotulos.html" class="btn primary">+ Nueva plantilla</a>
        </div>
      </div>

      <div class="controls">
        <input
          type="text"
          id="search"
          class="search"
          placeholder="Buscar por nombre o descripción..."
        />
        <span id="contador" class="subtitle"></span>
      </div>

      <div id="mensaje" class="aviso error" hidden></div>

      <div id="content">
        <div class="loading">Cargando plantillas...</div>
      </div>

      <div class="controls" style="justify-content: center; margin-top: 20px">
        <button class="btn" id="cargarMas" hidden>Cargar más</button>
      </div>
    </main>

    <!-- Modal de vista previa -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <img id="modalImg" alt="Vista previa del rótulo" />
        <h3 id="modalNombre"></h3>
        <dl>
          <dt>Tamaño</dt>
          <dd id="modalTamano"></dd>
          <dt>Elementos</dt>
          <dd id="modalElementos"></dd>
          <dt>Creada por</dt>
          <dd id="modalAutor"></dd>
          <dt>Actualizada</dt>
          <dd id="modalFecha"></dd>
        </dl>
        <div class="modal-close">
          <button class="btn" id="modalPdfBtn">Descargar PDF</button>
          <button class="btn" id="modalCloseBtn">Cerrar</button>
        </div>
      </div>
    </div>

    <script src="/assets/js/auth-api.js"></script>
    <script src="/assets/js/rotulos-api.js"></script>
    <script src="/assets/js/dashboard_rotulos.js"></script>
  </body>
</html>
