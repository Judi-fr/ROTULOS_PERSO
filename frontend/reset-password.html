<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Elegir contraseña nueva</title>

    <link
      href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap"
      rel="stylesheet"
    />

    <!-- Reusa el mismo estilo de tarjeta que perfil.html/cambiar-password.html. -->
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/perfil.css" />
  </head>
  <body>
    <div class="layout">
      <!-- Paso 2 de "olvidé mi contraseña": se llega por el link del correo,
           que trae uid y token en la query string. Esa es la credencial: no
           hace falta (ni se puede) estar logueado. -->
      <header class="topbar">
        <div class="topbar-user">
          <div class="topbar-user-info">
            <span class="topbar-user-name">Contraseña nueva</span>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="main-heading">
          <h1>Elegí una contraseña nueva</h1>
          <p>
            Mínimo 6 caracteres, con al menos una mayúscula y un número. Al
            guardarla se cierran todas las sesiones abiertas de tu cuenta.
          </p>
        </div>

        <p id="pageMessage" class="page-message" hidden></p>

        <section class="profile-card">
          <div class="profile-card-title">Nueva contraseña</div>
          <div class="profile-card-body">
            <form id="resetConfirmForm" novalidate>
              <div class="field">
                <label for="newPasswordInput">Nueva contraseña</label>
                <input
                  type="password"
                  id="newPasswordInput"
                  placeholder="Mínimo 6 caracteres, una mayúscula y un número"
                  autocomplete="new-password"
                  required
                />
              </div>
              <div class="field">
                <label for="confirmPasswordInput">Repetir la contraseña</label>
                <input
                  type="password"
                  id="confirmPasswordInput"
                  placeholder="La misma otra vez"
                  autocomplete="new-password"
                  required
                />
              </div>
              <div class="profile-card-actions">
                <button type="submit" class="btn btn-primary" id="submitBtn">
                  Guardar contraseña
                </button>
                <a class="btn btn-outline" href="index.html">Volver al login</a>
              </div>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/reset_password.js"></script>
  </body>
</html>
