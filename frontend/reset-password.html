<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Elegir contraseña nueva</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/css/ui.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Reusa el mismo estilo de tarjeta que perfil.html/cambiar-password.html. -->
      <link rel="stylesheet" href="assets/css/acceso.css" />
  </head>
  <body class="access-page">
    <!-- Paso 2 de "olvidé mi contraseña": se llega por el link del correo,
         que trae uid y token en la query string. Esa es la credencial: no
         hace falta (ni se puede) estar logueado. -->
    <div class="access-layout">
    <aside class="access-aside" aria-hidden="true">
      <img src="assets/images/humanlog-lockup.png" alt="">
      <p class="access-aside-text">Los pedidos de tu tienda entran solos: imprimí los rótulos y despachá con tu transportista <strong>desde un solo lugar</strong>.</p>
    </aside>
      <main class="access-main">
        <div class="access-card">
        <div class="access-brand"><img src="assets/images/humanlog-logo.png" alt="Human Log"><span>Rótulos</span></div>
          <h1>Elegí una contraseña nueva</h1>
          <p class="access-lead">Al guardarla se cierran todas las sesiones abiertas de tu cuenta.</p>
          <p id="pageMessage" class="page-message" role="alert" hidden></p>
          <form id="resetConfirmForm" class="access-form" novalidate>
            <div class="access-field">
              <label for="newPasswordInput">Nueva contraseña</label>
              <div class="access-input">
                <input type="password" id="newPasswordInput" autocomplete="new-password" required>
                <button type="button" class="access-reveal" data-reveal="newPasswordInput" aria-pressed="false">Ver</button>
              </div>
              <small>Al menos 6 caracteres, una mayúscula y un número.</small>
            </div>
            <div class="access-field">
              <label for="confirmPasswordInput">Repetí la contraseña</label>
              <input type="password" id="confirmPasswordInput" autocomplete="new-password" required>
            </div>
            <button type="submit" class="access-submit" id="submitBtn">Guardar contraseña</button>
          </form>
          <p class="access-switch"><a href="index.html" class="access-link">Volver al login</a></p>
        </div>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/reset_password.js"></script>
  </body>
</html>
