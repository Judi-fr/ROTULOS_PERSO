<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Nueva contraseña</title>
  <link href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.materialdesignicons.com/4.8.95/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  <main class="d-flex align-items-center min-vh-100 py-3 py-md-0">
    <div class="container">
      <div class="card login-card">
        <div class="row no-gutters">
          <div class="col-md-5">
            <img src="assets/images/LogoLogin.png" alt="nueva contraseña" class="login-card-img">
          </div>
          <div class="col-md-7">
            <div class="card-body">
              <div class="brand-wrapper">
                <img src="assets/images/HLLogoFinal.jpg" alt="logo" class="logo">
              </div>
              <p class="login-card-description">Elegí una contraseña nueva</p>

              <form action="" id="reset-form">
                <div class="form-group">
                  <label for="password" class="sr-only">Nueva clave</label>
                  <input type="password" id="password" class="form-control" placeholder="nueva contraseña" autocomplete="new-password">
                </div>
                <div class="form-group mb-4">
                  <label for="password2" class="sr-only">Repetir clave</label>
                  <input type="password" id="password2" class="form-control" placeholder="repetir contraseña" autocomplete="new-password">
                </div>

                <p class="login-card-footer-text">
                  Al menos 6 caracteres, una mayúscula y un número.
                </p>

                <div id="mensaje" class="alert alert-danger" hidden></div>
                <input id="guardar" class="btn btn-block login-btn mb-4" type="submit" value="Guardar contraseña">
              </form>

              <p class="login-card-footer-text"><a href="index.html" class="text-reset">Volver al inicio de sesión</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/auth-api.js"></script>
  <script>
  // uid y token vienen en el enlace del correo, que apunta a esta página con
  // ?uid=...&token=... (ver PASSWORD_RESET_URL en el .env del backend).
  const params = new URLSearchParams(location.search);
  const uid = params.get("uid");
  const token = params.get("token");

  const formulario = document.getElementById("reset-form");

  // Sin uid o token no hay nada que hacer: mostrar el formulario solo llevaría
  // a escribir una contraseña para que el backend la rechace después.
  if (!uid || !token) {
    formulario.hidden = true;
    mostrarMensaje(
      "El enlace está incompleto: le falta el uid o el token. Pedí uno nuevo desde «Olvidaste tu clave?»."
    );
  }

  formulario.addEventListener("submit", (event) => {
    event.preventDefault();

    const password = document.getElementById("password").value;
    if (password !== document.getElementById("password2").value) {
      mostrarMensaje("Las contraseñas no coinciden.");
      return;
    }

    const boton = document.getElementById("guardar");
    conBoton(boton, "Guardando...", async () => {
      const data = await postear("/auth/password-reset/confirm/", {
        uid: uid,
        token: token,
        new_password: password,
      });
      if (!data) return;
      // Al cambiar la contraseña el backend revoca los refresh tokens
      // vigentes, así que cualquier sesión guardada en este navegador ya no
      // sirve: se borra para no dejar restos que fallen al primer uso.
      localStorage.removeItem("access");
      localStorage.removeItem("refresh");
      localStorage.removeItem("user");
      formulario.hidden = true;
      // El texto del backend ya invita a iniciar sesión: se muestra tal cual.
      mostrarMensaje(data.detail, true);
    });
  });
  </script>
</body>
</html>
