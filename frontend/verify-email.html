<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Verificar email</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/css/ui.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Reusa el mismo estilo de tarjeta que perfil.html/cambiar-password.html (.profile-card). -->
      <link rel="stylesheet" href="assets/css/acceso.css" />
  </head>
  <body class="access-page">
    <!-- Se abre desde el link del correo, sin necesidad de estar logueado
         (el token de verificación es la credencial). -->
    <div class="access-layout">
    <aside class="access-aside" aria-hidden="true">
      <img src="assets/images/humanlog-lockup.png" alt="">
      <p class="access-aside-text">Los pedidos de tu tienda entran solos: imprimí los rótulos y despachá con tu transportista <strong>desde un solo lugar</strong>.</p>
    </aside>
      <main class="access-main">
        <div class="access-card">
        <div class="access-brand"><img src="assets/images/humanlog-logo.png" alt="Human Log"><span>Rótulos</span></div>
          <h1>Confirmar tu email</h1>
          <p class="access-lead">Estamos verificando el enlace que abriste desde tu correo.</p>
          <p id="verifyMsg" class="page-message" role="status" hidden></p>
          <a class="access-submit" href="index.html">Ir al login</a>
        </div>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script>
      const API_BASE = `${window.APP_CONFIG.API_BASE}/auth`;
      const VERIFY_EMAIL_CONFIRM_URL = `${API_BASE}/verify-email/confirm/`;

      const msg = document.getElementById("verifyMsg");
      const showMsg = (text, ok) => {
        if (!msg) return;
        msg.textContent = text;
        msg.className = `page-message ${ok ? "success" : "error"}`;
        msg.hidden = false;
      };

      const token = new URLSearchParams(window.location.search).get("token") || "";

      if (!token) {
        showMsg("Falta el token de verificación en el enlace.", false);
      } else {
        fetch(VERIFY_EMAIL_CONFIRM_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        })
          .then(async (res) => {
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              throw new Error(data?.detail || "El enlace de verificación no es válido.");
            }
            showMsg(data.detail || "Tu email quedó confirmado.", true);
          })
          .catch((err) => {
            showMsg(err.message || "Error de red. Revisá tu conexión.", false);
          });
      }
    </script>
  </body>
</html>
