<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Sumarte a un comercio</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/css/ui.css" />

    <link
      href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link rel="stylesheet" href="assets/css/equipo.css" />
  </head>
  <body>
    <div class="layout">
      <header class="topbar" id="appTopbar" data-links='[{"href": "dashboard.html", "label": "Ir al panel"}]'></header>

      <main class="main">
        <div class="main-heading">
          <h1>Sumarte a un comercio</h1>
          <p>
            Te pasaron el link de un comercio. Al pedir sumarte, quien lo administra
            elige qué vas a poder hacer y te aprueba. Tus otros comercios siguen igual.
          </p>
        </div>

        <p id="pageMessage" class="page-message" role="status" aria-live="polite" style="display:none;"></p>

        <section class="profile-card">
          <div class="profile-card-title">Código del comercio</div>
          <form class="profile-card-body team-name-row" id="joinForm">
            <div class="field">
              <label for="joinCode">Código</label>
              <input id="joinCode" type="text" maxlength="300" required autocomplete="off" />
            </div>
            <button type="submit" class="btn btn-primary">Pedir sumarme</button>
          </form>
          <div class="profile-card-body" id="doneBox" hidden>
            <a class="btn btn-outline" href="comercio_inicio.html">Ver mis pedidos e invitaciones</a>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/topbar.js"></script>
    <script src="assets/js/unirse.js"></script>
  </body>
</html>
