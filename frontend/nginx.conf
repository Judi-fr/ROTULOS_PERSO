# Sitio estático del frontend. No hay build ni framework: son los .html tal
# cual, así que esto solo sirve archivos.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin esto, una tilde en un .html se ve rota: los archivos están en UTF-8
    # y nginx anuncia latin-1 por defecto.
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # config.js se genera al arrancar el contenedor con la URL real de la API
    # (ver docker-entrypoint.sh). Si se cachea, un navegador que ya lo tiene
    # sigue apuntando a la API vieja después de mover el backend.
    location = /assets/js/config.js {
        add_header Cache-Control "no-store" always;
    }

    # El resto de los assets sí se cachean: cambian cuando se redespliega y
    # ahí cambia la imagen entera.
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public" always;
    }

    location / {
        # Nada de fallback a index.html: esto es multi-página, un .html que no
        # existe TIENE que dar 404 y no la pantalla de login disfrazada.
        try_files $uri $uri/ =404;
    }
}
