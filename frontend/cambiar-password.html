<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Cambiar contraseña</title>

    <link
      href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap"
      rel="stylesheet"
    />

    <!-- Reusa el mismo estilo de tarjeta que perfil.html (.profile-card). -->
    <link rel="stylesheet" href="assets/css/perfil.css" />
  </head>
  <body>
    <div class="layout">
      <!-- Sin sidebar ni links de navegación a propósito: mientras el cambio
           de contraseña está pendiente, el backend bloquea todo lo demás
           (ver apps.accounts.authentication.JWTAuthenticationWithPasswordPolicy),
           así que esta pantalla no ofrece manera de "saltearse" el paso. -->
      <header class="topbar">
        <div class="topbar-user">
          <div class="topbar-user-info">
            <span class="topbar-user-name">Cambio de contraseña requerido</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-outline" id="logoutBtn" type="button">
            Cerrar sesión
          </button>
        </div>
      </header>

      <main class="main">
        <div class="main-heading">
          <h1>Tenés que cambiar tu contraseña</h1>
          <p>
            Un administrador activó el cambio de contraseña obligatorio en tu cuenta
            (o te asignó una contraseña temporal). Ingresá tu contraseña actual y
            elegí una nueva para poder seguir usando el sistema.
          </p>
        </div>

        <section class="profile-card">
          <div class="profile-card-title">Nueva contraseña</div>
          <div class="profile-card-body">
            <div class="field">
              <label for="currentPasswordInput">Contraseña actual</label>
              <input type="password" id="currentPasswordInput" placeholder="Tu contraseña actual (o la temporal)" autocomplete="current-password" />
            </div>
            <div class="field">
              <label for="newPasswordInput">Nueva contraseña</label>
              <input type="password" id="newPasswordInput" placeholder="Mínimo 6 caracteres, una mayúscula y un número" autocomplete="new-password" />
            </div>
            <div class="field">
              <label for="confirmPasswordInput">Confirmar nueva contraseña</label>
              <input type="password" id="confirmPasswordInput" placeholder="Repetir nueva contraseña" autocomplete="new-password" />
            </div>
            <p id="passwordMsg" class="form-message" style="display:none;"></p>
            <div class="profile-card-actions">
              <button type="button" class="btn btn-primary" id="savePasswordBtn">
                Cambiar contraseña y continuar
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const API_BASE = "http://127.0.0.1:8000/api/v1/auth";
      const CHANGE_PASSWORD_URL = `${API_BASE}/me/change-password/`;
      const LOGOUT_URL = `${API_BASE}/logout/`;

      function getAccessToken() {
        return localStorage.getItem("access") || "";
      }

      function getCurrentUser() {
        try {
          return JSON.parse(localStorage.getItem("user") || "{}");
        } catch {
          return {};
        }
      }

      // Sin access token: no hay nada que cambiar, al login.
      if (!getAccessToken()) {
        window.location.replace("index.html");
      }

      const msg = document.getElementById("passwordMsg");
      const showMsg = (text, ok) => {
        if (!msg) return;
        msg.textContent = text;
        msg.style.color = ok ? "green" : "red";
        msg.style.display = "block";
      };

      document.getElementById("savePasswordBtn").addEventListener("click", async () => {
        const current = document.getElementById("currentPasswordInput").value.trim();
        const nuevo = document.getElementById("newPasswordInput").value.trim();
        const confirm = document.getElementById("confirmPasswordInput").value.trim();

        if (!current || !nuevo || !confirm) {
          showMsg("Completá los tres campos.", false);
          return;
        }

        try {
          const res = await fetch(CHANGE_PASSWORD_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${getAccessToken()}`,
            },
            body: JSON.stringify({
              current_password: current,
              new_password: nuevo,
              confirm_password: confirm,
            }),
          });

          if (res.status === 401) {
            localStorage.removeItem("access");
            localStorage.removeItem("refresh");
            localStorage.removeItem("user");
            window.location.replace("index.html");
            return;
          }

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const err =
              data?.current_password?.[0] ||
              data?.confirm_password?.[0] ||
              data?.new_password?.[0] ||
              data?.detail ||
              "No se pudo cambiar la contraseña.";
            showMsg(err, false);
            return;
          }

          // El backend ya apagó el flag: redirigir a donde corresponda por rol,
          // igual que hace el login (ver index.html).
          const user = getCurrentUser();
          const role = String(user.role || "").toLowerCase();
          const isAdmin = Boolean(user.is_staff || role === "admin");
          window.location.replace(isAdmin ? "gestionuser.html" : "dashboard.html");
        } catch {
          showMsg("Error de red. Revisá tu conexión.", false);
        }
      });

      document.getElementById("logoutBtn").addEventListener("click", async () => {
        const refresh = localStorage.getItem("refresh") || "";
        if (refresh) {
          try {
            await fetch(LOGOUT_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${getAccessToken()}`,
              },
              body: JSON.stringify({ refresh }),
            });
          } catch {
            // Igual se limpia la sesión local abajo aunque falle el backend.
          }
        }
        localStorage.removeItem("access");
        localStorage.removeItem("refresh");
        localStorage.removeItem("user");
        window.location.replace("index.html");
      });
    </script>
  </body>
</html>
