<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Recuperar contraseña</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/css/ui.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Reusa el mismo estilo de tarjeta que perfil.html/cambiar-password.html. -->
      <link rel="stylesheet" href="assets/css/acceso.css" />
  </head>
  <body class="access-page">
    <!-- Sin sesión: se abre desde el login. Paso 1 de dos; el paso 2 es
         reset-password.html, al que se llega por el link del correo. -->
    <div class="access-layout">
    <aside class="access-aside" aria-hidden="true">
      <img src="assets/images/humanlog-lockup.png" alt="">
      <p class="access-aside-text">Los pedidos de tu tienda entran solos: imprimí los rótulos y despachá con tu transportista <strong>desde un solo lugar</strong>.</p>
    </aside>
      <main class="access-main">
        <div class="access-card">
        <div class="access-brand"><img src="assets/images/humanlog-logo.png" alt="Human Log"><span>Rótulos</span></div>
          <h1>¿Olvidaste tu contraseña?</h1>
          <p class="access-lead">Escribí el email de tu cuenta y te mandamos un enlace para elegir una nueva. El enlace vence, así que usalo apenas te llegue.</p>
          <form id="resetRequestForm" class="access-form" novalidate>
            <div class="access-field">
              <label for="emailInput">Email</label>
              <input type="email" id="emailInput" placeholder="nombre@tucomercio.com" autocomplete="email" required>
            </div>
            <p id="pageMessage" class="page-message" role="alert" hidden></p>
            <button type="submit" class="access-submit" id="submitBtn">Enviarme el enlace</button>
          </form>
          <p class="access-switch"><a href="index.html" class="access-link">Volver al login</a></p>
        </div>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/recuperar_password.js"></script>
  </body>
</html>
