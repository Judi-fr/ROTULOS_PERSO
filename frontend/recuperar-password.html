<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Recuperar contraseña</title>
  <link href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.materialdesignicons.com/4.8.95/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  <main class="d-flex align-items-center min-vh-100 py-3 py-md-0">
    <div class="container">
      <div class="card login-card">
        <div class="row no-gutters">
          <div class="col-md-5">
            <img src="assets/images/LogoLogin.png" alt="recuperar" class="login-card-img">
          </div>
          <div class="col-md-7">
            <div class="card-body">
              <div class="brand-wrapper">
                <img src="assets/images/HLLogoFinal.jpg" alt="logo" class="logo">
              </div>
              <p class="login-card-description">Recuperar contraseña</p>
              <p class="login-card-footer-text">
                Poné tu email y te mandamos un enlace para elegir una nueva.
              </p>

              <form action="" id="recuperar-form">
                <div class="form-group mb-4">
                  <label for="email" class="sr-only">Email</label>
                  <input type="email" id="email" class="form-control" placeholder="email" autocomplete="email">
                </div>

                <div id="mensaje" class="alert alert-danger" hidden></div>
                <input id="enviar" class="btn btn-block login-btn mb-4" type="submit" value="Enviar enlace">
              </form>

              <p class="login-card-footer-text"><a href="index.html" class="text-reset">Volver al inicio de sesión</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/auth-api.js"></script>
  <script>
  document.getElementById("recuperar-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const boton = document.getElementById("enviar");
    conBoton(boton, "Enviando...", async () => {
      const data = await postear("/auth/password-reset/", {
        email: document.getElementById("email").value.trim(),
      });
      if (!data) return;
      // El backend responde 200 exista o no la cuenta, y con el mismo texto,
      // para no revelar qué emails están registrados. Por eso se muestra su
      // mensaje tal cual en vez de inventar acá un "te lo enviamos".
      mostrarMensaje(data.detail, true);
      document.getElementById("recuperar-form").reset();
    });
  });
  </script>
</body>
</html>
