<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Recuperar contraseña</title>

    <link
      href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap"
      rel="stylesheet"
    />

    <!-- Reusa el mismo estilo de tarjeta que perfil.html/cambiar-password.html. -->
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/perfil.css" />
  </head>
  <body>
    <div class="layout">
      <!-- Sin sidebar ni topbar de usuario a propósito: esta pantalla se abre
           desde el login, sin sesión. Paso 1 de dos; el paso 2 es
           reset-password.html, al que se llega por el link del correo. -->
      <header class="topbar">
        <div class="topbar-user">
          <div class="topbar-user-info">
            <span class="topbar-user-name">Recuperar contraseña</span>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="main-heading">
          <h1>¿Olvidaste tu contraseña?</h1>
          <p>
            Escribí el email de tu cuenta y te mandamos un enlace para elegir una
            nueva. El enlace vence, así que usalo apenas te llegue.
          </p>
        </div>

        <p id="pageMessage" class="page-message" hidden></p>

        <section class="profile-card">
          <div class="profile-card-title">Tu email</div>
          <div class="profile-card-body">
            <form id="resetRequestForm" novalidate>
              <div class="field">
                <label for="emailInput">Email</label>
                <input
                  type="email"
                  id="emailInput"
                  placeholder="tucuenta@ejemplo.com"
                  autocomplete="email"
                  required
                />
              </div>
              <div class="profile-card-actions">
                <button type="submit" class="btn btn-primary" id="submitBtn">
                  Enviarme el enlace
                </button>
                <a class="btn btn-outline" href="index.html">Volver al login</a>
              </div>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/recuperar_password.js"></script>
  </body>
</html>
