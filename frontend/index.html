<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="stylesheet" href="assets/css/ui.css" />
  <link href="https://fonts.googleapis.com/css?family=Karla:400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/acceso.css">
</head>
<body class="access-page">
  <div class="access-layout">
    <aside class="access-aside" aria-hidden="true">
      <img src="assets/images/humanlog-lockup.png" alt="">
      <p class="access-aside-text">Los pedidos de tu tienda entran solos: imprimí los rótulos y despachá con tu transportista <strong>desde un solo lugar</strong>.</p>
    </aside>

    <main class="access-main">
      <div class="access-card">
        <div class="access-brand"><img src="assets/images/humanlog-logo.png" alt="Human Log"><span>Rótulos</span></div>
        <h1>Entrá a tu cuenta</h1>
        <p class="access-lead">Con Google o con tu email y contraseña.</p>

        <div id="g_id_signin" class="access-google"></div>
        <div class="access-divider">o</div>

        <form id="login-form" class="access-form" novalidate>
          <div class="access-field">
            <label for="user">Email</label>
            <input type="email" name="user" id="user" autocomplete="email" placeholder="nombre@tucomercio.com" required>
          </div>
          <div class="access-field">
            <div class="access-field-row">
              <label for="password">Contraseña</label>
              <a href="recuperar-password.html" class="access-link">¿Te la olvidaste?</a>
            </div>
            <div class="access-input">
              <input type="password" name="password" id="password" autocomplete="current-password" required>
              <button type="button" class="access-reveal" data-reveal="password" aria-pressed="false">Ver</button>
            </div>
          </div>
          <p id="pageMessage" class="page-message" role="alert" hidden></p>
          <button type="submit" class="access-submit">Entrar</button>
        </form>

        <p class="access-switch">¿No tenés cuenta? <a href="register.html" class="access-link">Creá una</a></p>
      </div>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <!-- window.Auth: la sesión viaja en cookies HttpOnly (withSession/saveSession). -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Client ID del OAuth client "Web application" (Google Cloud Console).
    // Es un identificador público (va en el HTML servido al navegador), no un
    // secreto: la verificación real del token ocurre en el backend contra
    // GOOGLE_CLIENT_ID (backend/.env).
    const GOOGLE_CLIENT_ID = '399413683717-ook49mdogo9oierje6dh2cnn6g9djcs0.apps.googleusercontent.com';

    // Mismo shape de respuesta que login/register manual (auth_response del
    // backend), así que guardar quién es y la redirección por rol son
    // idénticos a los del form de usuario/contraseña. Los tokens no pasan por
    // acá: el backend los dejó en cookies HttpOnly.
    function handleAuthSuccess(data) {
      window.Auth.saveSession(data.user);
      if (data.user && data.user.must_change_password) {
        window.location.replace('cambiar-password.html');
        return;
      }
      const role = String((data.user && data.user.role) || '').toLowerCase();
      const isAdmin = Boolean((data.user && data.user.is_staff) || role === 'admin');
      // Si venía de instalar la app en su tienda sin sesión (tiendas.js guardó
      // el enlace de vinculación), vuelve a terminar ese paso.
      // Lo mismo si venía de "Imprimir rótulos" en las acciones masivas de
        // Tiendanube (assets/js/tiendanube/imprimir_tiendanube.js guardó los pedidos elegidos).
        window.location.replace(localStorage.getItem('pendingTiendanubePrint') ? (localStorage.getItem('pendingTiendanubePage') || 'imprimir_tiendanube.html') : localStorage.getItem('pendingStoreClaim') ? 'tiendas.html' : localStorage.getItem('pendingJoinCode') ? 'unirse.html?code=' + encodeURIComponent(localStorage.getItem('pendingJoinCode')) : (isAdmin ? 'gestionuser.html' : 'dashboard.html'));
    }

    // Callback de Google Identity Services: response.credential es el ID
    // token (JWT) que el backend verifica en /api/v1/auth/google/.
    async function handleGoogleCredential(response) {
      try {
        const apiResponse = await fetch(`${window.APP_CONFIG.API_BASE}/auth/google/`, window.Auth.withSession({
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ credential: response.credential })
        }));

        const data = await apiResponse.json().catch(() => ({}));

        if (!apiResponse.ok) {
          throw new Error(data.detail || 'No se pudo iniciar sesión con Google.');
        }

        handleAuthSuccess(data);
      } catch (error) {
        showMessage(error.message || 'No se pudo iniciar sesión con Google.');
      }
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential
      });
      // Google pide el ancho en píxeles: el de su contenedor (en el celular es menos de 380).
      const googleBox = document.getElementById('g_id_signin');
      google.accounts.id.renderButton(
        googleBox,
        { theme: 'outline', size: 'large', width: Math.min(380, googleBox.clientWidth || 380), text: 'continue_with' }
      );
    };

    document.getElementById('login-form').addEventListener('submit', async function (event) {
      event.preventDefault();

      const email = document.getElementById('user').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        showMessage('Escribí tu email y tu contraseña.');
        return;
      }

      try {
        const response = await fetch(`${window.APP_CONFIG.API_BASE}/auth/login/`, window.Auth.withSession({
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        }));

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.detail || 'El email o la contraseña no son correctos.');
        }

        window.Auth.saveSession(data.user);

        // Cambio de contraseña obligatorio pendiente (admin creó la cuenta sin
        // password, o la marcó manualmente): el backend lo hace cumplir en
        // cualquier otro endpoint (403), pero acá se redirige de una para no
        // esperar al primer llamado bloqueado.
        if (data.user && data.user.must_change_password) {
          window.location.replace('cambiar-password.html');
          return;
        }

        // El backend es la autoridad real de permisos; el front solo elige la
        // pantalla de aterrizaje. Admin (grupo admin o is_staff) entra directo
        // a la gestión de usuarios; el resto va a su panel (dashboard.html).
        const role = String((data.user && data.user.role) || '').toLowerCase();
        const isAdmin = Boolean((data.user && data.user.is_staff) || role === 'admin');
        // Si venía de instalar la app en su tienda sin sesión (tiendas.js guardó
        // el enlace de vinculación), vuelve a terminar ese paso.
        // Lo mismo si venía de "Imprimir rótulos" en las acciones masivas de
        // Tiendanube (assets/js/tiendanube/imprimir_tiendanube.js guardó los pedidos elegidos).
        window.location.replace(localStorage.getItem('pendingTiendanubePrint') ? (localStorage.getItem('pendingTiendanubePage') || 'imprimir_tiendanube.html') : localStorage.getItem('pendingStoreClaim') ? 'tiendas.html' : localStorage.getItem('pendingJoinCode') ? 'unirse.html?code=' + encodeURIComponent(localStorage.getItem('pendingJoinCode')) : (isAdmin ? 'gestionuser.html' : 'dashboard.html'));
      } catch (error) {
        showMessage(error.message || 'El email o la contraseña no son correctos.');
      }
    });
  </script>
</body>
</html>
