    <script>
    $( "#login-form" ).submit(function( event ) {
 
 	  var auser = document.getElementById("user").value;
 	  var apassword = document.getElementById("password").value;

		$.ajax({
			type: 'POST',			
			url : "access.php",	
				
			data: {user:auser, password:apassword},			
			success: function (response) {
				if(response=='1') {
                 {
            window.location.replace("menu.php");
                }    
				}
        else
        {
            alert("Error en usuario o clave - Reingrese");
				}

			},
        error : function(){
           alert('error ajax');        }
		});

  event.preventDefault();
});
   </script>
