<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Acceso a Plugin</title>
  <link href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.materialdesignicons.com/4.8.95/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  <main class="d-flex align-items-center min-vh-100 py-3 py-md-0">
    <div class="container">
      <div class="card login-card">
        <div class="row no-gutters">
          <div class="col-md-5">
            <img src="assets/images/LogoLogin.png" alt="login" class="login-card-img">
          </div>
          <div class="col-md-7">
            <div class="card-body">
              <div class="brand-wrapper">
                <img src="assets/images/HLLogoFinal.jpg" alt="logo" class="logo">
              </div>
              <p class="login-card-description">Ingresa con tu cuenta</p>

              <form id="login-form">
                <div class="form-group mb-3">
                  <label for="user" class="sr-only">Usuario</label>
                  <input type="text" name="user" id="user" class="form-control" placeholder="usuario">
                </div>
                <div class="form-group mb-4">
                  <label for="password" class="sr-only">Clave</label>
                  <input type="password" name="password" id="password" class="form-control" placeholder="***********">
                </div>
                <button type="submit" class="btn btn-block login-btn mb-4">Login</button>
              </form>

              <a href="#!" class="forgot-password-link">Olvidaste tu clave?</a>
              <p class="login-card-footer-text">No tienes cuenta aun? <a href="#!" class="text-reset">Regístrate aquí</a></p>
              <nav class="login-card-footer-nav">
                <a href="#!">Terminos de uso.</a>
                <a href="#!">Política de Privacidad</a>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', async function (event) {
      event.preventDefault();

      const email = document.getElementById('user').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://127.0.0.1:8000/api/v1/auth/login/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.detail || 'Error en usuario o clave - Reingrese');
        }

        localStorage.setItem('access', data.access || '');
        localStorage.setItem('refresh', data.refresh || '');
        localStorage.setItem('user', JSON.stringify(data.user || {}));
        // Tanto admin como usuario autenticado válido entran a gestionuser.html.
        // El backend es la autoridad real de permisos; el front solo adapta la UI.
        window.location.replace('gestionuser.html');
      } catch (error) {
        alert(error.message || 'Error en usuario o clave - Reingrese');
      }
    });
  </script>
</body>
</html>
