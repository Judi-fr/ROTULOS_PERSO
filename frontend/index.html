<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Acceso a Plugin</title>
  <link href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.materialdesignicons.com/4.8.95/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  <main class="d-flex align-items-center min-vh-100 py-3 py-md-0">
    <div class="container">
      <div class="card login-card">
        <div class="row no-gutters">
          <div class="col-md-5">
            <img src="assets/images/LogoLogin.png" alt="login" class="login-card-img">
          </div>
          <div class="col-md-7">
            <div class="card-body">
              <div class="brand-wrapper">
                <img src="assets/images/HLLogoFinal.jpg" alt="logo" class="logo">
              </div>
              <p class="login-card-description">Ingresa con tu cuenta</p>

              <div id="g_id_signin"></div>
              <div class="login-divider text-center my-3">o</div>

              <form id="login-form">
                <div class="form-group mb-3">
                  <label for="user" class="sr-only">Usuario</label>
                  <input type="text" name="user" id="user" class="form-control" placeholder="usuario">
                </div>
                <div class="form-group mb-4">
                  <label for="password" class="sr-only">Clave</label>
                  <input type="password" name="password" id="password" class="form-control" placeholder="***********">
                </div>
                <button type="submit" class="btn btn-block login-btn mb-4">Login</button>
              </form>

              <a href="#!" class="forgot-password-link">Olvidaste tu clave?</a>
              <p class="login-card-footer-text">No tienes cuenta aun? <a href="register.html" class="text-reset">Regístrate aquí</a></p>
              <nav class="login-card-footer-nav">
                <a href="#!">Terminos de uso.</a>
                <a href="#!">Política de Privacidad</a>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Client ID del OAuth client "Web application" (Google Cloud Console).
    // Es un identificador público (va en el HTML servido al navegador), no un
    // secreto: la verificación real del token ocurre en el backend contra
    // GOOGLE_CLIENT_ID (backend/.env).
    const GOOGLE_CLIENT_ID = '399413683717-ook49mdogo9oierje6dh2cnn6g9djcs0.apps.googleusercontent.com';

    // Mismo shape de respuesta que login/register manual (auth_response del
    // backend), así que el guardado en localStorage y la redirección por rol
    // son idénticos a los del form de usuario/contraseña.
    function handleAuthSuccess(data) {
      localStorage.setItem('access', data.access || '');
      localStorage.setItem('refresh', data.refresh || '');
      localStorage.setItem('user', JSON.stringify(data.user || {}));
      if (data.user && data.user.must_change_password) {
        window.location.replace('cambiar-password.html');
        return;
      }
      const role = String((data.user && data.user.role) || '').toLowerCase();
      const isAdmin = Boolean((data.user && data.user.is_staff) || role === 'admin');
      window.location.replace(isAdmin ? 'gestionuser.html' : 'dashboard.html');
    }

    // Callback de Google Identity Services: response.credential es el ID
    // token (JWT) que el backend verifica en /api/v1/auth/google/.
    async function handleGoogleCredential(response) {
      try {
        const apiResponse = await fetch('http://127.0.0.1:8000/api/v1/auth/google/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ credential: response.credential })
        });

        const data = await apiResponse.json().catch(() => ({}));

        if (!apiResponse.ok) {
          throw new Error(data.detail || 'No se pudo iniciar sesión con Google.');
        }

        handleAuthSuccess(data);
      } catch (error) {
        alert(error.message || 'No se pudo iniciar sesión con Google.');
      }
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential
      });
      google.accounts.id.renderButton(
        document.getElementById('g_id_signin'),
        { theme: 'outline', size: 'large', width: '100%', text: 'continue_with' }
      );
    };

    document.getElementById('login-form').addEventListener('submit', async function (event) {
      event.preventDefault();

      const email = document.getElementById('user').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://127.0.0.1:8000/api/v1/auth/login/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.detail || 'Error en usuario o clave - Reingrese');
        }

        localStorage.setItem('access', data.access || '');
        localStorage.setItem('refresh', data.refresh || '');
        localStorage.setItem('user', JSON.stringify(data.user || {}));

        // Cambio de contraseña obligatorio pendiente (admin creó la cuenta sin
        // password, o la marcó manualmente): el backend lo hace cumplir en
        // cualquier otro endpoint (403), pero acá se redirige de una para no
        // esperar al primer llamado bloqueado.
        if (data.user && data.user.must_change_password) {
          window.location.replace('cambiar-password.html');
          return;
        }

        // El backend es la autoridad real de permisos; el front solo elige la
        // pantalla de aterrizaje. Admin (grupo admin o is_staff) entra directo
        // a la gestión de usuarios; el resto va a su panel (dashboard.html).
        const role = String((data.user && data.user.role) || '').toLowerCase();
        const isAdmin = Boolean((data.user && data.user.is_staff) || role === 'admin');
        window.location.replace(isAdmin ? 'gestionuser.html' : 'dashboard.html');
      } catch (error) {
        alert(error.message || 'Error en usuario o clave - Reingrese');
      }
    });
  </script>
</body>
</html>
