<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Mis Pedidos</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
    <meta name="theme-color" content="#308028" />
    <link rel="stylesheet" href="assets/css/ui.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link rel="stylesheet" href="assets/css/pedidos.css" />
    <link rel="stylesheet" href="assets/css/acciones_masivas.css" />
    <link rel="stylesheet" href="assets/css/pedidos_envios.css" />
    <link rel="stylesheet" href="assets/css/pedidos_tiendas.css?v=2026-11-11" />
  </head>
  <body data-requires="orders.view">
    <div class="layout">
      <!-- La barra la dibuja assets/js/topbar.js; acá solo los links propios. -->
      <header class="topbar" id="appTopbar" data-links='[{"href": "importar.html", "label": "Importar planilla", "perm": "orders.import"}, {"href": "exportar_pedidos.html", "label": "Exportar", "perm": "orders.export"}, {"href": "estado_pedidos.html", "label": "Cambiar estado", "perm": "orders.dispatch"}, {"href": "imprimir_rotulos.html", "label": "Imprimir rótulos", "perm": "labels.batch"}, {"href": "escanear.html", "label": "Escanear", "perm": "orders.dispatch"}, {"href": "dashboard.html", "label": "Volver al panel"}]'></header>

      <main class="main orders-main">
        <!-- Título y las dos acciones de la página en una fila: antes las
             acciones iban en el título de una tarjeta que repetía "Pedidos". -->
        <div class="orders-head">
          <div class="main-heading">
            <h1>Mis pedidos</h1>
            <p>Elegí pedidos y despachalos: el transportista, el número y el link de seguimiento se cargan solos.</p>
          </div>
          <!-- Para transportistas sin API: su planilla de seguimientos (pedidos/seguimientos.js). -->
          <div class="profile-card-tools orders-head-tools">
            <button type="button" class="btn btn-outline" id="trackingImportBtn" hidden>Cargar seguimientos desde planilla</button>
            <button type="button" class="btn btn-primary" id="openNewOrderBtn"><i class="ph ph-plus" aria-hidden="true"></i> Nuevo pedido</button>
          </div>
        </div>

        <p id="pageMessage" class="page-message" role="status" aria-live="polite" style="display:none;"></p>

        <!-- Pedidos -->
        <section class="profile-card orders-card" aria-label="Pedidos">
          <div class="profile-card-body">
            <div class="orders-layout">
              <!-- Columna de tiendas: una por tienda conectada, con su color (los
                   arma pedidos.js desde la API, así una tienda nueva aparece sola).
                   Solo se muestra si el usuario tiene alguna tienda. -->
              <nav class="store-filter" id="orderStoreFilterField" aria-labelledby="orderStoreFilterLabel" hidden>
                <span class="store-filter-label" id="orderStoreFilterLabel">Tiendas</span>
                <div class="store-chips" id="orderStoreFilter" role="group" aria-labelledby="orderStoreFilterLabel"></div>
              </nav>
              <div class="orders-column">
                <!-- Transportista conectado (Andreani) y accesos a su configuración:
                     lo dibuja assets/js/pedidos/envios.js. -->
                <div class="carrier-strip" id="carrierStrip" hidden></div>
                <!-- Barra de acciones sobre los pedidos tildados (pedidos/envios.js). -->
                <div class="selection-bar" id="selectionBar" hidden>
                  <span id="selectionCount"></span>
                  <div class="selection-actions">
                    <button type="button" class="btn btn-primary btn-small" id="dispatchSelectedBtn">Despachar</button>
                    <button type="button" class="btn btn-outline btn-small" id="labelsSelectedBtn">Imprimir</button>
                    <button type="button" class="btn btn-outline btn-small" id="manifestSelectedBtn">Planilla de retiro</button>
                    <button type="button" class="btn-link" id="clearSelectionBtn">Quitar selección</button>
                  </div>
                </div>
                <!-- Pedidos de ejemplo cargados (utils.js, renderSampleOrdersNotice). -->
                <div id="sampleNotice" class="sample-notice" role="status" hidden></div>
                <!-- Buscador por número, destinatario o seguimiento (pedidos.js). -->
                <div class="order-search" role="search">
                  <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
                  <input type="search" id="orderSearch" placeholder="Buscar por número, destinatario o seguimiento" aria-label="Buscar pedidos" autocomplete="off" />
                </div>
                <!-- Vista abierta desde un número del panel (pedidos.js, ORDER_VIEWS). -->
                <div class="order-view-notice" id="orderViewNotice" hidden>
                  <i class="ph ph-funnel" aria-hidden="true"></i>
                  <span id="orderViewLabel"></span>
                  <button type="button" class="btn-link" id="clearOrderViewBtn">Ver todos</button>
                </div>
                <div id="orderList" class="order-list">
                  <p class="empty-state"><span class="app-skeleton" role="status" aria-label="Cargando…"><span></span><span></span><span></span></span></p>
                </div>
                <div class="orders-pager" id="ordersPager" style="display:none;">
                  <button type="button" class="btn btn-outline btn-small" id="ordersPrevBtn">Anterior</button>
                  <span id="ordersPageInfo"></span>
                  <button type="button" class="btn btn-outline btn-small" id="ordersNextBtn">Siguiente</button>
                </div>
              </div>
            </div>
          </div>
        </section>
        <!-- Nuevo pedido a mano: un diálogo, no otra sección de la página
             (pedidos.js, openNewOrder). Las direcciones tienen su página. -->
        <dialog class="dispatch-dialog new-order-dialog" id="newOrderDialog" aria-labelledby="newOrderTitle">
          <form method="dialog" class="new-order-form" id="newOrderFormDialog">
            <header class="new-order-head">
              <h2 id="newOrderTitle">Nuevo pedido</h2>
              <p>Para un envío que no entró por una tienda: a quién va y adónde.</p>
            </header>
            <div id="newOrderForm" class="new-order-fields">
              <div class="field" id="orderAddressPick">
                <label for="orderAddressSelect">Enviar a</label>
                <select id="orderAddressSelect"></select>
                <a class="field-help-link" href="direcciones.html">Administrar direcciones</a>
              </div>
              <!-- Dirección nueva sin salir del diálogo (renderAddressFields, utils.js);
                   queda guardada en Mis direcciones para el próximo pedido. -->
              <fieldset id="newAddressBox" class="new-order-address" hidden>
                <legend>Dirección nueva <span>· queda guardada en Mis direcciones</span></legend>
                <div id="newAddressFields"></div>
              </fieldset>
              <div class="field">
                <label for="orderDescription">Descripción (opcional)</label>
                <input type="text" id="orderDescription" placeholder="Ej. Caja mediana con rótulos" />
              </div>
              <p id="orderFormMsg" class="form-message" style="display:none;"></p>
            </div>
            <div class="form-actions">
              <button type="button" class="btn btn-outline" id="closeNewOrderBtn">Volver</button>
              <button type="button" class="btn btn-primary" id="createOrderBtn">Crear pedido</button>
            </div>
          </form>
        </dialog>

      </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/topbar.js"></script>
    <!-- Despacho: pedidos/envios.js (estado del envío en cada pedido, selección,
         etiquetas), pedidos/despacho.js (el diálogo "Despachar") y
         pedidos/planilla.js (la planilla de retiro) y pedidos/seguimientos.js
         (cargar seguimientos desde la planilla del transportista). Antes de
         pedidos.js, que los usa al dibujar la lista. -->
    <dialog class="dispatch-dialog" id="dispatchDialog" aria-labelledby="dispatchTitle"></dialog>
    <dialog class="dispatch-dialog" id="manifestDialog" aria-labelledby="manifestTitle"></dialog>
    <dialog class="dispatch-dialog dispatch-dialog-wide" id="trackingDialog" aria-labelledby="trackingTitle"></dialog>
    <script src="assets/js/pedidos/envios.js"></script>
    <script src="assets/js/pedidos/despacho.js"></script>
    <script src="assets/js/pedidos/planilla.js"></script>
    <script src="assets/js/pedidos/seguimientos.js"></script>
    <script src="assets/js/pedidos.js"></script>
  </body>
</html>
