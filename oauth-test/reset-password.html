<!DOCTYPE html>
<!--
  PÁGINA DE PRUEBA TEMPORAL — destino del link del correo de reset.
  El correo de "Restablecé tu contraseña" apunta acá con ?uid=...&token=...
  Esta página los lee de la URL y hace el POST a /password-reset/confirm/ con
  la contraseña nueva. Cuando exista el frontend real, se reemplaza por una
  ruta de la SPA y se borra oauth-test/ completa.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Restablecer contraseña — Rótulos Perso</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.2rem; }
    label { display: block; font-size: 0.85rem; margin: 0.75rem 0 0.15rem; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; font-size: 0.9rem; cursor: pointer; }
    button:hover { background: #1558b0; }
    button:disabled { background: #9db8dd; cursor: not-allowed; }
    .aviso { color: #666; font-size: 0.85rem; }
    #resultado { margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.9rem; }
    #resultado.ok { background: #e8f5e9; border-left: 4px solid #2e7d32; }
    #resultado.error { background: #fdecea; border-left: 4px solid #c62828; }
    code { background: #f4f4f4; padding: 0.1rem 0.3rem; border-radius: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Restablecer contraseña</h1>
  <p class="aviso">
    Elegí una contraseña nueva. Los datos <code>uid</code> y <code>token</code>
    se toman automáticamente del enlace del correo.
  </p>

  <form id="reset-form">
    <label for="new-password">Contraseña nueva</label>
    <input id="new-password" type="password" autocomplete="new-password" required
           minlength="6" pattern="(?=.*[A-Z])(?=.*\d).{6,}"
           title="Mínimo 6 caracteres, con al menos una mayúscula y un número.">
    <small class="aviso">Mínimo 6 caracteres, una mayúscula y un número.</small>

    <label for="confirm-password">Repetir contraseña</label>
    <input id="confirm-password" type="password" autocomplete="new-password" required>

    <button type="submit" id="submit-btn">Cambiar contraseña</button>
  </form>

  <div id="resultado" hidden></div>

  <script>
    // Dirección del BACKEND (la máquina que corre Django). Igual que en
    // index.html: si abrís esta página en otra PC, cambiá localhost por la IP.
    const API_BASE = "http://localhost:8000";

    // uid y token vienen en el query string del enlace del correo.
    const params = new URLSearchParams(location.search);
    const uid = params.get("uid");
    const token = params.get("token");

    const resultado = document.getElementById("resultado");
    function mostrar(texto, ok) {
      resultado.hidden = false;
      resultado.className = ok ? "ok" : "error";
      resultado.textContent = texto;
    }

    // Si el enlace llegó sin uid/token, no tiene sentido mostrar el formulario.
    if (!uid || !token) {
      document.getElementById("reset-form").hidden = true;
      mostrar("Enlace inválido: falta el uid o el token. Volvé a pedir el "
        + "restablecimiento desde la página principal.", false);
    }

    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pass = document.getElementById("new-password").value;
      const confirm = document.getElementById("confirm-password").value;

      // Chequeo local: que las dos contraseñas coincidan (el backend igual
      // valida composición y token).
      if (pass !== confirm) {
        mostrar("Las contraseñas no coinciden.", false);
        return;
      }

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      try {
        const res = await fetch(API_BASE + "/api/v1/auth/password-reset/confirm/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uid, token, new_password: pass }),
        });
        const data = await res.json();
        if (res.ok) {
          mostrar((data.detail || "Contraseña actualizada.")
            + " Ya podés cerrar esta pestaña e iniciar sesión.", true);
          document.getElementById("reset-form").hidden = true;
        } else {
          mostrar(data.detail || ("Error HTTP " + res.status), false);
          btn.disabled = false;
        }
      } catch (err) {
        mostrar("Error de red: ¿está el backend en " + API_BASE + "?", false);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
